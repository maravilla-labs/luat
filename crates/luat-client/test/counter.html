<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luat Client — Counter Test</title>
    <style>
        body { font-family: system-ui, sans-serif; padding: 2rem; }
        button { font-size: 1.2rem; padding: 0.5rem 1rem; cursor: pointer; }
        #status { margin-top: 1rem; color: #666; font-size: 0.9rem; }
    </style>
</head>
<body>
    <!--
        Counter test page for luat-client WASM runtime.

        This simulates server output with pre-encoded markers:
        - EventMarker (id=0): click handler "count = count + 1"
        - ExprMarker (id=1): expression "count", deps=["count"], value=Int(0)

        Generated by: cargo test -p luat --features client-markers --test client_markers generate_counter_markers

        To run:
          1. make wasm-client-release
          2. Copy/symlink artifacts to this directory:
             - cp crates/luat-client/luat-client.js crates/luat-client/test/
             - cp target/wasm32-unknown-emscripten/release/luat_client.wasm crates/luat-client/test/
             - Create luat-client-wasm.mjs by appending "export default Module;" to the
               Emscripten output: cat target/wasm32-unknown-emscripten/release/luat-client.js > crates/luat-client/test/luat-client-wasm.mjs && echo "export default Module;" >> crates/luat-client/test/luat-client-wasm.mjs
          3. Serve this directory: python3 -m http.server 8080 --directory crates/luat-client/test/
          4. Open http://localhost:8080/counter.html
    -->

    <!--l:AAEFY2xpY2sRY291bnQgPSBjb3VudCArIDEA--><button>Count: <!--l:AQAFY291bnQBBWNvdW50AgA=-->0</button>

    <div id="status">Loading WASM runtime...</div>

    <script type="module">
        import { initClient } from './luat-client.js';

        try {
            await initClient('.');
            document.getElementById('status').textContent =
                'Runtime ready. Click the button!';
        } catch (e) {
            document.getElementById('status').textContent =
                'Error: ' + e.message;
            console.error('[luat-client] Init failed:', e);
        }
    </script>
</body>
</html>
